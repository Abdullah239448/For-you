<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You ❤️</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="For You ❤️">
  <link rel="apple-touch-icon" href="https://img.magnific.com/free-vector/valentines-day-background-with-grunge-style-hearts-design_1048-21054.jpg?semt=ais_hybrid&w=740&q=80">

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background 0.5s ease;
    }

    /* Outer Top "Need Love" Button */
    .top-need-love-container {
      position: fixed;
      top: 14px;
      z-index: 50;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .need-love-top-btn {
      background: rgba(255, 42, 85, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 42, 85, 0.35);
      transition: all 0.3s ease;
    }

    .need-love-top-btn:active {
      transform: scale(0.92);
    }

    /* Fix Mobile Dark Pink Theme Mode */
body.dark-pink-mode {
  background: linear-gradient(135deg, #2d0a14 0%, #4a0e22 50%, #1f050d 100%) !important;
  background-attachment: fixed !important;
  background-size: cover !important;
}

/* Dim & Darken Floating Hearts on Mobile in Dark Mode */
body.dark-pink-mode .bg-heart {
  opacity: 0.18 !important;
  filter: brightness(0.5) drop-shadow(0 0 5px rgba(255, 42, 85, 0.4)) !important;
}

body.dark-pink-mode .need-love-top-btn {
  background: rgba(255, 117, 140, 0.25) !important;
  border-color: rgba(255, 117, 140, 0.5) !important;
  color: #ff758c !important;
}

    /* Floating Background Hearts */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -10%;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.35;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-height: 88dvh;
      overflow-y: auto;
      margin-top: 30px;
      transition: all 0.5s ease;
    }

    body.dark-pink-mode .card {
      background: rgba(45, 10, 20, 0.82);
      border-color: rgba(255, 117, 140, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Top Navigation Tabs */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
      gap: 4px;
    }

    .fav-btn {
      background: rgba(255, 42, 85, 0.1);
      border: 1px solid rgba(255, 42, 85, 0.2);
      color: #ff2a55;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    /* Interactive Heart Button */
    .heart-btn {
      background: linear-gradient(135deg, #ff2a55 0%, #ff5e62 100%);
      color: #ffffff;
      border: none;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.3;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(255, 42, 85, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .heart-btn:active {
      transform: scale(0.92);
    }

    .heart-btn:disabled {
      background: linear-gradient(135deg, #d1d1d6 0%, #e5e5ea 100%);
      box-shadow: none;
      cursor: not-allowed;
      color: #8e8e93;
    }

    /* Compliment Container */
    .compliment-container {
      min-height: 140px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .compliment-text {
      font-size: 15px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.5;
      text-align: center;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .compliment-text.hidden {
      opacity: 0;
      transform: translateY(10px) scale(0.95);
    }

    /* Bookmark Action Bar */
    .action-bar {
      margin-bottom: 12px;
      height: 28px;
    }

    .bookmark-btn {
      background: none;
      border: none;
      color: #ff2a55;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .counter {
      font-size: 12px;
      font-weight: 600;
      color: rgba(60, 60, 67, 0.6);
    }

    .timer {
      font-size: 12px;
      font-weight: 700;
      color: #ff2a55;
    }

    /* "Need Love" Special View Elements */
    .need-love-view {
      display: none;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      padding: 10px 0;
    }

    .need-love-mode-title {
      font-size: 18px;
      font-weight: 800;
      color: #ff758c;
      margin-bottom: 6px;
    }

    .need-love-mode-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 12px;
    }

    .need-love-btn-option {
      background: linear-gradient(135deg, #ff2a55 0%, #b8002e 100%);
      color: white;
      border: 1px solid rgba(255, 117, 140, 0.4);
      padding: 18px;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .need-love-btn-option:active {
      transform: scale(0.95);
    }

    .long-text-body {
      font-size: 14px;
      line-height: 1.6;
      color: #2d0a14;
      text-align: left;
      white-space: pre-line;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Favorites & Milestones Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ff2a55;
    }

    .close-btn {
      background: #f2f2f7;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
    }

    .fav-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .fav-item {
      background: #fff0f3;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      color: #b8002e;
      font-weight: 500;
      border-left: 3px solid #ff2a55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .delete-fav-btn {
      background: rgba(255, 42, 85, 0.15);
      border: none;
      color: #ff2a55;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-favs {
      text-align: center;
      color: #8e8e93;
      font-size: 14px;
      padding: 20px 0;
    }

    .prev-btn {
      background: rgba(255, 42, 85, 0.12);
      border: 1px solid rgba(255, 42, 85, 0.25);
      color: #ff2a55;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: -8px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .prev-btn:active {
      transform: scale(0.94);
      background: rgba(255, 42, 85, 0.25);
    }

    /* Fixed Dynamic Flip Card Styles */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 4px;
    }

    .flip-card {
      background-color: transparent;
      width: 100%;
      min-height: 105px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 105px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      display: grid;
      grid-template-rows: 1fr;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      min-height: 105px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      box-sizing: border-box;
    }

    .flip-card-front {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(255, 42, 85, 0.25);
    }

    .flip-card-back {
      background: #fff0f3;
      color: #b8002e;
      transform: rotateY(180deg);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.45;
      border: 1px solid rgba(255, 42, 85, 0.2);
    }

    .passcode-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .passcode-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.3);
    }

    .passcode-title {
      font-size: 20px;
      font-weight: 700;
      color: #ff2a55;
      margin-bottom: 4px;
    }

    .passcode-sub {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 16px;
    }

    .pin-display {
      font-size: 60px;
      letter-spacing: 10px;
      color: #b8002e;
      margin-bottom: 20px;
      height: 58px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 240px;
      margin: 0 auto;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 42, 85, 0.2);
      color: #ff2a55;
      font-size: 20px;
      font-weight: 700;
      height: 54px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .key-btn:active {
      transform: scale(0.9);
      background: #ff2a55;
      color: white;
    }

    .key-btn.clear { color: #8e8e93; border-color: #d1d1d6; }
    .key-btn.enter { background: #ff2a55; color: white; border: none; }

    .passcode-error {
      font-size: 12px;
      font-weight: 700;
      color: #ff2a55;
      margin-top: 14px;
      display: none;
    }

    /* To-Do Tabs Navigation */
    .todo-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(255, 42, 85, 0.08);
      padding: 4px;
      border-radius: 20px;
    }

    .todo-tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 8px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #ff2a55;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .todo-tab-btn.active {
      background: #ff2a55;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 42, 85, 0.3);
    }

    /* List Items & Checkboxes */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff0f3;
      padding: 12px 14px;
      border-radius: 16px;
      border-left: 4px solid #ff2a55;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .todo-item:active {
      transform: scale(0.98);
    }

    .todo-item.completed {
      opacity: 0.6;
      background: #f2f2f7;
      border-left-color: #8e8e93;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #ff2a55;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: white;
      transition: all 0.2s ease;
    }

    .todo-item.completed .todo-checkbox {
      background: #ff2a55;
      border-color: #ff2a55;
    }

    .todo-checkbox::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: 800;
      display: none;
    }

    .todo-item.completed .todo-checkbox::after {
      display: block;
    }

    .todo-text {
      font-size: 14px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.4;
      text-align: left;
      transition: all 0.2s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <!-- Need Love Button Positioned Outside Main Card at Top -->
  <div class="top-need-love-container">
    <button class="need-love-top-btn" id="toggleNeedLoveBtn">Need Love 💖</button>
  </div>

  <!-- Passcode Lock Screen -->
  <div class="passcode-overlay" id="passcodeOverlay">
    <div class="passcode-card">
      <div class="passcode-title">Enter Passcode 🔒</div>
      <div class="passcode-sub">This app is strictly for you ❤️</div>
      <div class="pin-display" id="pinDisplay">••••</div>
      <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn clear" onclick="clearKey()">✕</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn enter" onclick="submitPin()">✓</button>
      </div>
      <div class="passcode-error" id="pinError">Incorrect PIN, try again!</div>
    </div>
  </div>

  <div class="bg-hearts" id="bgHearts"></div>

  <div class="card" id="mainCard">
    <!-- Standard Normal UI Elements -->
    <div id="standardAppContent" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="top-bar">
        <button class="fav-btn" id="openMilestones">📖 Our Story</button>
        <button class="fav-btn" id="openTodoList">📝 To-Do</button>
        <button class="fav-btn" id="openFavs">❤️ Saved (<span id="favCount">0</span>)</button>
      </div>

      <button class="heart-btn" id="loveBtn">Things I Love About You ❤️</button>
      <button class="prev-btn" id="prevBtn" style="display: none;">⏮ Previous</button>
      
      <div class="compliment-container">
        <div class="compliment-text" id="displayBox">Tap the heart to unlock!</div>
      </div>

      <div class="action-bar">
        <button class="bookmark-btn" id="bookmarkBtn">❤️ Save to Favorites</button>
      </div>
      
      <div class="footer-info">
        <div class="counter" id="counterText">5 / 5 available this hour</div>
        <div class="timer" id="timerText"></div>
      </div>
    </div>

    <!-- Need Love Mode View -->
    <div class="need-love-view" id="needLoveView">
      <div class="need-love-mode-title">I'm Always Here For You 💖</div>
      <div class="need-love-mode-sub">Pick what kind of love you need right now:</div>
      
      <button class="need-love-btn-option" id="btnGenuine">Genuine 🤍</button>
      <button class="need-love-btn-option" id="btnChatpta">Chatpta 🌶️</button>
    </div>
  </div>

  <!-- Favorites Modal -->
  <div class="modal" id="favModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Saved Hearts ❤️</div>
        <button class="close-btn" id="closeFavs">✕</button>
      </div>
      <div class="fav-list" id="favList"></div>
    </div>
  </div>

  <!-- Milestones Modal -->
  <div class="modal" id="milestonesModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Our Story 📖</div>
        <button class="close-btn" id="closeMilestones">✕</button>
      </div>
      <div class="cards-stack" id="milestonesList"></div>
    </div>
  </div>

  <!-- To-Do List Modal -->
  <div class="modal" id="todoModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Our To-Do List 📝</div>
        <button class="close-btn" id="closeTodo">✕</button>
      </div>
      <div class="todo-tabs">
        <button class="todo-tab-btn active" id="tabRomantic" onclick="switchTodoTab('romantic')">Romantic 💕</button>
        <button class="todo-tab-btn" id="tabIntimate" onclick="switchTodoTab('intimate')">Intimate 🔥</button>
      </div>
      <div class="todo-list" id="todoListContainer"></div>
    </div>
  </div>

  <!-- Text Popup Modal for Need Love Mode -->
  <div class="modal" id="textPopupModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="textPopupTitle">For You ❤️</div>
        <button class="close-btn" id="closeTextPopup">✕</button>
      </div>
      <div class="long-text-body" id="textPopupBody"></div>
    </div>
  </div>

  <script>
    const compliments = [
      
    let isNeedLoveMode = false;
    let currentTodoTab = 'romantic';

    // Storage Helper for Completed Checkboxes
    function getCompletedTodos() {
      const data = localStorage.getItem('love_app_todos');
      return data ? JSON.parse(data) : [];
    }

    function toggleTodoItem(itemText) {
      let completed = getCompletedTodos();
      if (completed.includes(itemText)) {
        completed = completed.filter(i => i !== itemText);
      } else {
        completed.push(itemText);
        triggerCelebration();
      }
      localStorage.setItem('love_app_todos', JSON.stringify(completed));
      renderTodoList();
    }

    function switchTodoTab(category) {
      currentTodoTab = category;
      document.getElementById('tabRomantic').classList.toggle('active', category === 'romantic');
      document.getElementById('tabIntimate').classList.toggle('active', category === 'intimate');
      renderTodoList();
    }

    function renderTodoList() {
      const container = document.getElementById('todoListContainer');
      container.innerHTML = '';
      const completed = getCompletedTodos();
      const items = todoData[currentTodoTab] || [];

      items.forEach(itemText => {
        const isDone = completed.includes(itemText);
        const itemEl = document.createElement('div');
        itemEl.className = `todo-item ${isDone ? 'completed' : ''}`;
        itemEl.onclick = () => toggleTodoItem(itemText);

        itemEl.innerHTML = `
          <div class="todo-checkbox"></div>
          <div class="todo-text">${itemText}</div>
        `;

        container.appendChild(itemEl);
      });
    }

    // Toggle "Need Love" Dark Mode Screen
    const toggleNeedLoveBtn = document.getElementById('toggleNeedLoveBtn');
    const standardAppContent = document.getElementById('standardAppContent');
    const needLoveView = document.getElementById('needLoveView');

    toggleNeedLoveBtn.addEventListener('click', () => {
      isNeedLoveMode = !isNeedLoveMode;
      document.body.classList.toggle('dark-pink-mode', isNeedLoveMode);

      if (isNeedLoveMode) {
        standardAppContent.style.display = 'none';
        needLoveView.style.display = 'flex';
        toggleNeedLoveBtn.innerText = 'Back to Normal 💕';
      } else {
        standardAppContent.style.display = 'flex';
        needLoveView.style.display = 'none';
        toggleNeedLoveBtn.innerText = 'Need Love 💖';
      }
    });

    // Handle Text Popups for Genuine & Chatpta
    const textPopupModal = document.getElementById('textPopupModal');
    const textPopupTitle = document.getElementById('textPopupTitle');
    const textPopupBody = document.getElementById('textPopupBody');

    document.getElementById('btnGenuine').addEventListener('click', () => {
      textPopupTitle.innerText = "Genuine Love 🤍";
      textPopupBody.innerText = genuineText;
      textPopupModal.style.display = 'flex';
      triggerCelebration();
    });

    document.getElementById('btnChatpta').addEventListener('click', () => {
      textPopupTitle.innerText = "Chatpta Love 🌶️";
      textPopupBody.innerText = chatptaText;
      textPopupModal.style.display = 'flex';
      triggerCelebration();
    });

    document.getElementById('closeTextPopup').addEventListener('click', () => {
      textPopupModal.style.display = 'none';
    });

    // Modal Toggle Handlers for To-Do List
    const todoModal = document.getElementById('todoModal');
    document.getElementById('openTodoList').addEventListener('click', () => {
      renderTodoList();
      todoModal.style.display = 'flex';
    });

    document.getElementById('closeTodo').addEventListener('click', () => {
      todoModal.style.display = 'none';
    });

    const MAX_VIEWS = 7;
    const HOUR_IN_MS = 60 * 60 * 1000;

    let currentCompliment = '';
    let viewHistory = [];
    let historyIndex = -1;

    const loveBtn = document.getElementById('loveBtn');
    const prevBtn = document.getElementById('prevBtn');
    const displayBox = document.getElementById('displayBox');
    const counterText = document.getElementById('counterText');
    const timerText = document.getElementById('timerText');
    const bookmarkBtn = document.getElementById('bookmarkBtn');

    const bgHeartsContainer = document.getElementById('bgHearts');
    const heartSymbols = ['❤️', '💖', '✨', '💕'];
    for (let i = 0; i < 500; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 7}s`;
      heart.style.animationDuration = `${6 + Math.random() * 6}s`;
      bgHeartsContainer.appendChild(heart);
    }

    const CORRECT_PIN = "1806"; 
    let enteredPin = "";

    function updatePinDisplay() {
      const dots = "•".repeat(enteredPin.length) + "◦".repeat(4 - enteredPin.length);
      document.getElementById('pinDisplay').innerText = enteredPin.length > 0 ? dots : "◦◦◦◦";
    }

    function pressKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDisplay();
        document.getElementById('pinError').style.display = 'none';
      }
    }

    function clearKey() {
      enteredPin = "";
      updatePinDisplay();
      document.getElementById('pinError').style.display = 'none';
    }

    function submitPin() {
      if (enteredPin === CORRECT_PIN) {
        document.getElementById('passcodeOverlay').style.display = 'none';
        sessionStorage.setItem('app_unlocked', 'true');
        triggerCelebration();
      } else {
        document.getElementById('pinError').style.display = 'block';
        enteredPin = "";
        updatePinDisplay();
      }
    }

    window.addEventListener('load', () => {
      if (sessionStorage.getItem('app_unlocked') === 'true') {
        document.getElementById('passcodeOverlay').style.display = 'none';
      }
    });

    function getStoredData() {
      const data = localStorage.getItem('love_app_data');
      return data ? JSON.parse(data) : { timestamps: [], favorites: [], queue: [] };
    }

    function saveStoredData(data) {
      localStorage.setItem('love_app_data', JSON.stringify(data));
    }

    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextCompliment() {
      const data = getStoredData();
      let queue = data.queue || [];

      if (queue.length === 0) {
        const indices = Array.from({ length: compliments.length }, (_, i) => i);
        queue = shuffleArray(indices);
      }

      const nextIndex = queue.pop();
      data.queue = queue;
      saveStoredData(data);

      return compliments[nextIndex];
    }

    function getValidTimestamps() {
      const now = Date.now();
      const { timestamps } = getStoredData();
      return (timestamps || []).filter(ts => now - ts < HOUR_IN_MS);
    }

    function updateUI() {
      const validTimestamps = getValidTimestamps();
      validTimestamps.sort((a, b) => a - b);
      const remaining = MAX_VIEWS - validTimestamps.length;

      if (validTimestamps.length === 0) {
        viewHistory = [];
        historyIndex = -1;
        prevBtn.style.display = 'none';
      }

      if (remaining > 0) {
        loveBtn.disabled = false;
        counterText.innerText = `${remaining} / ${MAX_VIEWS} available this hour`;
        timerText.innerText = "";
      } else {
        loveBtn.disabled = true;
        counterText.innerText = "0 / 5 available this hour";
        const oldestClick = validTimestamps[0];
        const nextUnlock = oldestClick + HOUR_IN_MS;
        const msLeft = nextUnlock - Date.now();

        if (msLeft > 0) {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          timerText.innerText = `Next heart unlocks in ${minutes}m ${seconds}s`;
        } else {
          updateUI();
        }
      }

      const { favorites = [] } = getStoredData();
      document.getElementById('favCount').innerText = favorites.length;
    }

    function triggerCelebration() {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 30]);
      }
      confetti({
        particleCount: 35,
        spread: 60,
        origin: { y: 0.7 },
        colors: ['#ff2a55', '#ff758c', '#ff7eb3']
      });
    }

    loveBtn.addEventListener('click', () => {
      let validTimestamps = getValidTimestamps();

      if (validTimestamps.length < MAX_VIEWS) {
        currentCompliment = getNextCompliment();
        
        viewHistory.push(currentCompliment);
        if (viewHistory.length > validTimestamps.length + 1) {
          viewHistory.shift();
        }
        historyIndex = viewHistory.length - 1;

        displayBox.classList.add('hidden');
        setTimeout(() => {
          displayBox.innerText = currentCompliment;
          displayBox.classList.remove('hidden');
        }, 150);

        validTimestamps.push(Date.now());
        const data = getStoredData();
        data.timestamps = validTimestamps;
        saveStoredData(data);

        triggerCelebration();
        updateUI();

        bookmarkBtn.style.display = 'inline-flex';
        bookmarkBtn.innerText = "❤️ Save to Favorites";

        if (viewHistory.length > 1) {
          prevBtn.style.display = 'inline-flex';
        }
      }
    });

    prevBtn.addEventListener('click', () => {
      if (historyIndex > 0) {
        historyIndex--;
        currentCompliment = viewHistory[historyIndex];

        displayBox.classList.add('hidden');
        setTimeout(() => {
          displayBox.innerText = currentCompliment;
          displayBox.classList.remove('hidden');
        }, 150);

        const { favorites = [] } = getStoredData();
        bookmarkBtn.style.display = 'inline-flex';
        bookmarkBtn.innerText = favorites.includes(currentCompliment) ? "✓ Saved!" : "❤ Save to Favorites";
      }
    });

    bookmarkBtn.addEventListener('click', () => {
      if (!currentCompliment) return;
      const data = getStoredData();
      let favorites = data.favorites || [];

      if (!favorites.includes(currentCompliment)) {
        favorites.push(currentCompliment);
        data.favorites = favorites;
        saveStoredData(data);
        bookmarkBtn.innerText = "✓ Saved!";
        updateUI();
      }
    });

    function renderFavorites() {
      const { favorites = [] } = getStoredData();
      favList.innerHTML = '';

      if (favorites.length === 0) {
        favList.innerHTML = '<div class="empty-favs">No saved compliments yet! Tap "Save to Favorites" when unlocking a compliment.</div>';
      } else {
        favorites.forEach((fav, index) => {
          const item = document.createElement('div');
          item.className = 'fav-item';
          
          const textSpan = document.createElement('span');
          textSpan.innerText = fav;
          
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-fav-btn';
          deleteBtn.innerText = '✕';
          deleteBtn.onclick = () => removeFavorite(index);

          item.appendChild(textSpan);
          item.appendChild(deleteBtn);
          favList.appendChild(item);
        });
      }
    }

    function removeFavorite(indexToRemove) {
      const data = getStoredData();
      let favorites = data.favorites || [];
      favorites.splice(indexToRemove, 1);
      data.favorites = favorites;
      saveStoredData(data);
      renderFavorites();
      updateUI();
    }

    function renderMilestones() {
      const container = document.getElementById('milestonesList');
      container.innerHTML = '';

      milestones.forEach(m => {
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="flip-card-front">${m.front}</div>
            <div class="flip-card-back">${m.back}</div>
          </div>
        `;
        card.addEventListener('click', () => card.classList.toggle('flipped'));
        container.appendChild(card);
      });
    }

    const favModal = document.getElementById('favModal');
    const favList = document.getElementById('favList');
    const milestonesModal = document.getElementById('milestonesModal');

    document.getElementById('openFavs').addEventListener('click', () => {
      renderFavorites();
      favModal.style.display = 'flex';
    });

    document.getElementById('closeFavs').addEventListener('click', () => {
      favModal.style.display = 'none';
    });

    document.getElementById('openMilestones').addEventListener('click', () => {
      renderMilestones();
      milestonesModal.style.display = 'flex';
    });

    document.getElementById('closeMilestones').addEventListener('click', () => {
      milestonesModal.style.display = 'none';
    });

    window.addEventListener('load', () => {
      updateUI();
    });

    setInterval(updateUI, 1000);

    // PWA Setup
    const manifest = {
      "name": "For You ❤",
      "short_name": "For You",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ff9a9e",
      "theme_color": "#ff2a55",
      "icons": [{
        "src": "https://img.magnific.com/free-vector/valentines-day-background-with-grunge-style-hearts-design_1048-21054.jpg?semt=ais_hybrid&w=740&q=80",
        "sizes": "512x512",
        "type": "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'app-cache-v4';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(
              keys.map(key => key !== CACHE_NAME ? caches.delete(key) : null)
            )).then(() => self.clients.claim())
          );
        });
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      });
    }
  </script>
</body>
</html>
