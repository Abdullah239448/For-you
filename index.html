<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>For You ❤️</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="For You ❤️">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/ff3b30/ffffff?text=%E2%9D%A4%EF%B8%8F">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Floating Background Hearts */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -10%;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.35;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 32px;
      padding: 36px 24px 28px 24px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(214, 40, 74, 0.7);
      margin-bottom: 24px;
    }

    /* Interactive Glow Button */
    .button-wrapper {
      position: relative;
      margin-bottom: 28px;
    }

    .heart-btn {
      background: linear-gradient(135deg, #ff2a55 0%, #ff5e62 100%);
      color: #ffffff;
      border: none;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.35;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(255, 42, 85, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 12px rgba(255, 42, 85, 0.3);
    }

    .heart-btn:disabled {
      background: linear-gradient(135deg, #d1d1d6 0%, #e5e5ea 100%);
      box-shadow: none;
      cursor: not-allowed;
      color: #8e8e93;
    }

    /* Compliment Display Box with Smooth Pop Effect */
    .compliment-container {
      min-height: 100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    .compliment-text {
      font-size: 17px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.45;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .compliment-text.hidden {
      opacity: 0;
      transform: translateY(12px) scale(0.95);
    }

    /* Counter & Timer Footer */
    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .counter {
      font-size: 13px;
      font-weight: 600;
      color: rgba(60, 60, 67, 0.6);
    }

    .timer {
      font-size: 13px;
      font-weight: 700;
      color: #ff2a55;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div class="bg-hearts" id="bgHearts"></div>

  <!-- Main App Card -->
  <div class="card">
    <div class="app-title">Just For You</div>

    <div class="button-wrapper">
      <button class="heart-btn" id="loveBtn">Why I Love You ❤️</button>
    </div>
    
    <div class="compliment-container">
      <div class="compliment-text" id="displayBox">Tap the heart to start!</div>
    </div>
    
    <div class="footer-info">
      <div class="counter" id="counterText">5 / 5 available this hour</div>
      <div class="timer" id="timerText"></div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // EDIT YOUR COMPLIMENTS HERE
    // -----------------------------------------------------------------
    const compliments = [
      "Your laugh instantly brightens up my whole day.",
      "You have the kindest and sweetest heart.",
      "I love how thoughtful you are with everyone around you.",
      "Being with you makes everything infinitely better.",
      "You make me smile without even trying.",
      "Your eyes light up whenever you get excited about something.",
      "You are my absolute favorite person to talk to.",
      "I love how passionate you get about the things you care about.",
      "You make even simple, ordinary days feel special.",
      "You inspire me every single day."
    ];

    const MAX_VIEWS = 5;
    const HOUR_IN_MS = 60 * 60 * 1000;

    const loveBtn = document.getElementById('loveBtn');
    const displayBox = document.getElementById('displayBox');
    const counterText = document.getElementById('counterText');
    const timerText = document.getElementById('timerText');
    let lastUsedIndex = -1;

    // Create floating background hearts dynamically
    const bgHeartsContainer = document.getElementById('bgHearts');
    const heartSymbols = ['❤️', '💖', '✨', '💕'];
    
    for (let i = 0; i < 14; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 7}s`;
      heart.style.animationDuration = `${6 + Math.random() * 6}s`;
      bgHeartsContainer.appendChild(heart);
    }

    // LocalStorage helper functions
    function getStoredData() {
      const data = localStorage.getItem('love_app_data');
      return data ? JSON.parse(data) : { timestamps: [] };
    }

    function saveStoredData(timestamps) {
      localStorage.setItem('love_app_data', JSON.stringify({ timestamps }));
    }

    function getValidTimestamps() {
      const now = Date.now();
      const { timestamps } = getStoredData();
      return timestamps.filter(ts => now - ts < HOUR_IN_MS);
    }

    function getRandomCompliment() {
      if (compliments.length <= 1) return compliments[0];
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * compliments.length);
      } while (randomIndex === lastUsedIndex);
      
      lastUsedIndex = randomIndex;
      return compliments[randomIndex];
    }

    function updateUI() {
      const validTimestamps = getValidTimestamps();
      const remaining = MAX_VIEWS - validTimestamps.length;

      if (remaining > 0) {
        loveBtn.disabled = false;
        counterText.innerText = `${remaining} / ${MAX_VIEWS} available this hour`;
        timerText.innerText = "";
      } else {
        loveBtn.disabled = true;
        counterText.innerText = "0 / 5 available this hour";
        
        const oldestClick = validTimestamps[0];
        const nextUnlock = oldestClick + HOUR_IN_MS;
        const msLeft = nextUnlock - Date.now();

        if (msLeft > 0) {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          timerText.innerText = `Next heart unlocks in ${minutes}m ${seconds}s`;
        }
      }
    }

    loveBtn.addEventListener('click', () => {
      let validTimestamps = getValidTimestamps();

      if (validTimestamps.length < MAX_VIEWS) {
        // Trigger smooth pop transition
        displayBox.classList.add('hidden');
        
        setTimeout(() => {
          displayBox.innerText = getRandomCompliment();
          displayBox.classList.remove('hidden');
        }, 200);

        validTimestamps.push(Date.now());
        saveStoredData(validTimestamps);
        updateUI();
      }
    });

    setInterval(updateUI, 1000);
    updateUI();

    // Inline PWA Setup
    const manifest = {
      "name": "For You ❤️",
      "short_name": "For You",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ff9a9e",
      "theme_color": "#ff2a55",
      "icons": [{
        "src": "https://via.placeholder.com/192/ff2a55/ffffff?text=%E2%9D%A4%EF%B8%8F",
        "sizes": "192x192",
        "type": "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      });
    }
  </script>
</body>
</html>
