  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Floating Background Hearts */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -10%;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.35;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-height: 94dvh;
      overflow-y: auto;
    }

    /* Top Navigation Tabs */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(214, 40, 74, 0.8);
    }

    .fav-btn {
      background: rgba(255, 42, 85, 0.1);
      border: 1px solid rgba(255, 42, 85, 0.2);
      color: #ff2a55;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Interactive Heart Button */
    .heart-btn {
      background: linear-gradient(135deg, #ff2a55 0%, #ff5e62 100%);
      color: #ffffff;
      border: none;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.3;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(255, 42, 85, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .heart-btn:active {
      transform: scale(0.92);
    }

    .heart-btn:disabled {
      background: linear-gradient(135deg, #d1d1d6 0%, #e5e5ea 100%);
      box-shadow: none;
      cursor: not-allowed;
      color: #8e8e93;
    }

    /* Compliment Container */
    .compliment-container {
      min-height: 140px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .compliment-text {
      font-size: 15px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.5;
      text-align: center;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .compliment-text.hidden {
      opacity: 0;
      transform: translateY(10px) scale(0.95);
    }

    /* Bookmark Action Bar */
    .action-bar {
      margin-bottom: 12px;
      height: 28px;
    }

    .bookmark-btn {
      background: none;
      border: none;
      color: #ff2a55;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .counter {
      font-size: 12px;
      font-weight: 600;
      color: rgba(60, 60, 67, 0.6);
    }

    .timer {
      font-size: 12px;
      font-weight: 700;
      color: #ff2a55;
    }

    /* Favorites Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ff2a55;
    }

    .close-btn {
      background: #f2f2f7;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
    }

    .fav-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .fav-item {
      background: #fff0f3;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      color: #b8002e;
      font-weight: 500;
      border-left: 3px solid #ff2a55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

    .delete-fav-btn {
      background: rgba(255, 42, 85, 0.15);

      color: #ff2a55;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;

    }

    .empty-favs {

    .prev-btn {

      font-weight: 700;
      cursor: pointer;
      margin-top: -8px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .prev-btn:active {
      transform: scale(0.94);
      background: rgba(255, 42, 85, 0.25);
    }
  </style>

    const MAX_VIEWS = 7;
    const HOUR_IN_MS = 60 * 60 * 1000;

    let currentCompliment = '';
    let viewHistory = [];
    let historyIndex = -1;

    const loveBtn = document.getElementById('loveBtn');
    const prevBtn = document.getElementById('prevBtn');
    const displayBox = document.getElementById('displayBox');
    const counterText = document.getElementById('counterText');
    const timerText = document.getElementById('timerText');
    const bookmarkBtn = document.getElementById('bookmarkBtn');

    const bgHeartsContainer = document.getElementById('bgHearts');
    const heartSymbols = ['❤️', '💖', '✨', '💕'];
    for (let i = 0; i < 500; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 7}s`;
      heart.style.animationDuration = `${6 + Math.random() * 6}s`;
      bgHeartsContainer.appendChild(heart);
    }

    function getStoredData() {
      const data = localStorage.getItem('love_app_data');
      return data ? JSON.parse(data) : { timestamps: [], favorites: [], queue: [] };
    }

    function saveStoredData(data) {
      localStorage.setItem('love_app_data', JSON.stringify(data));
    }

    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextCompliment() {
      const data = getStoredData();
      let queue = data.queue || [];

      if (queue.length === 0) {
        const indices = Array.from({ length: compliments.length }, (_, i) => i);
        queue = shuffleArray(indices);
      }

      const nextIndex = queue.pop();
      data.queue = queue;
      saveStoredData(data);

      return compliments[nextIndex];
    }

    function getValidTimestamps() {
      const now = Date.now();
      const { timestamps } = getStoredData();
      return (timestamps || []).filter(ts => now - ts < HOUR_IN_MS);
    }

    function updateUI() {
      const validTimestamps = getValidTimestamps();
      validTimestamps.sort((a, b) => a - b);
      const remaining = MAX_VIEWS - validTimestamps.length;

      // Clear history array if hourly limit resets
      if (validTimestamps.length === 0) {
        viewHistory = [];
        historyIndex = -1;
        prevBtn.style.display = 'none';
      }

      if (remaining > 0) {
        loveBtn.disabled = false;
        counterText.innerText = `${remaining} / ${MAX_VIEWS} available this hour`;
        timerText.innerText = "";
      } else {
        loveBtn.disabled = true;
        counterText.innerText = "0 / 5 available this hour";
        const oldestClick = validTimestamps[0];
        const nextUnlock = oldestClick + HOUR_IN_MS;
        const msLeft = nextUnlock - Date.now();

        if (msLeft > 0) {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          timerText.innerText = `Next heart unlocks in ${minutes}m ${seconds}s`;
        } else {
          updateUI();
        }
      }

      const { favorites = [] } = getStoredData();
      document.getElementById('favCount').innerText = favorites.length;
    }

    function triggerCelebration() {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 30]);
      }
      confetti({
        particleCount: 35,
        spread: 60,
        origin: { y: 0.7 },
        colors: ['#ff2a55', '#ff758c', '#ff7eb3']
      });
    }

    loveBtn.addEventListener('click', () => {
      let validTimestamps = getValidTimestamps();

      if (validTimestamps.length < MAX_VIEWS) {
        currentCompliment = getNextCompliment();
        
        // Track current 5-compliment history
        viewHistory.push(currentCompliment);
        if (viewHistory.length > validTimestamps.length + 1) {
          viewHistory.shift();
        }
        historyIndex = viewHistory.length - 1;

        displayBox.classList.add('hidden');
        setTimeout(() => {
          displayBox.innerText = currentCompliment;
          displayBox.classList.remove('hidden');
        }, 150);

        validTimestamps.push(Date.now());
        const data = getStoredData();
        data.timestamps = validTimestamps;
        saveStoredData(data);

        triggerCelebration();
        updateUI();

        bookmarkBtn.style.display = 'inline-flex';
        bookmarkBtn.innerText = "❤️ Save to Favorites";

        if (viewHistory.length > 1) {
          prevBtn.style.display = 'inline-flex';
        }
      }
    });

    prevBtn.addEventListener('click', () => {
      if (historyIndex > 0) {
        historyIndex--;
        currentCompliment = viewHistory[historyIndex];

        displayBox.classList.add('hidden');
        setTimeout(() => {
          displayBox.innerText = currentCompliment;
          displayBox.classList.remove('hidden');
        }, 150);

        const { favorites = [] } = getStoredData();
        bookmarkBtn.style.display = 'inline-flex';
        bookmarkBtn.innerText = favorites.includes(currentCompliment) ? "✓ Saved!" : "❤️ Save to Favorites";
      }
    });

    bookmarkBtn.addEventListener('click', () => {
      if (!currentCompliment) return;
      const data = getStoredData();
      let favorites = data.favorites || [];

      if (!favorites.includes(currentCompliment)) {
        favorites.push(currentCompliment);
        data.favorites = favorites;
        saveStoredData(data);
        bookmarkBtn.innerText = "✓ Saved!";
        updateUI();
      }
    });

    function renderFavorites() {
      const { favorites = [] } = getStoredData();
      favList.innerHTML = '';

      if (favorites.length === 0) {
        favList.innerHTML = '<div class="empty-favs">No saved compliments yet! Tap "Save to Favorites" when unlocking a compliment.</div>';
      } else {
        favorites.forEach((fav, index) => {
          const item = document.createElement('div');
          item.className = 'fav-item';
          
          const textSpan = document.createElement('span');
          textSpan.innerText = fav;
          
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-fav-btn';
          deleteBtn.innerText = '✕';
          deleteBtn.onclick = () => removeFavorite(index);

          item.appendChild(textSpan);
          item.appendChild(deleteBtn);
          favList.appendChild(item);
        });
      }
    }

    function removeFavorite(indexToRemove) {
      const data = getStoredData();
      let favorites = data.favorites || [];
      favorites.splice(indexToRemove, 1);
      data.favorites = favorites;
      saveStoredData(data);
      renderFavorites();
      updateUI();
    }

    const favModal = document.getElementById('favModal');
    const favList = document.getElementById('favList');

    document.getElementById('openFavs').addEventListener('click', () => {
      renderFavorites();
      favModal.style.display = 'flex';
    });

    document.getElementById('closeFavs').addEventListener('click', () => {
      favModal.style.display = 'none';
    });

    window.addEventListener('load', () => {
      updateUI();
    });

    setInterval(updateUI, 1000);

    // PWA Setup
    const manifest = {
      "name": "For You ❤️️",
      "short_name": "For You",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ff9a9e",
      "theme_color": "#ff2a55",
      "icons": [{
        "src": "https://img.magnific.com/free-vector/valentines-day-background-with-grunge-style-hearts-design_1048-21054.jpg?semt=ais_hybrid&w=740&q=80",
        "sizes": "512x512",
        "type": "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'app-cache-v2';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      });
    }
  </script>
</body>
</html>
