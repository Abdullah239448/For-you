  <!-- Canvas Confetti Library -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Floating Background Hearts */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -10%;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.35;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-height: 94dvh;
      overflow-y: auto;
    }

    /* Top Navigation Tabs */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
      gap: 4px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(214, 40, 74, 0.8);
    }

    .fav-btn {
      background: rgba(255, 42, 85, 0.1);
      border: 1px solid rgba(255, 42, 85, 0.2);
      color: #ff2a55;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    /* Interactive Heart Button */
    .heart-btn {
      background: linear-gradient(135deg, #ff2a55 0%, #ff5e62 100%);
      color: #ffffff;
      border: none;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.3;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(255, 42, 85, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .heart-btn:active {
      transform: scale(0.92);
    }

    .heart-btn:disabled {
      background: linear-gradient(135deg, #d1d1d6 0%, #e5e5ea 100%);
      box-shadow: none;
      cursor: not-allowed;
      color: #8e8e93;
    }

    /* Compliment Container */
    .compliment-container {
      min-height: 140px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .compliment-text {
      font-size: 15px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.5;
      text-align: center;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .compliment-text.hidden {
      opacity: 0;
      transform: translateY(10px) scale(0.95);
    }

    /* Bookmark Action Bar */
    .action-bar {
      margin-bottom: 12px;
      height: 28px;
    }

    .bookmark-btn {
      background: none;
      border: none;
      color: #ff2a55;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .counter {
      font-size: 12px;
      font-weight: 600;
      color: rgba(60, 60, 67, 0.6);
    }

    .timer {
      font-size: 12px;
      font-weight: 700;
      color: #ff2a55;
    }

    /* Favorites & Milestones Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ff2a55;
    }

    .close-btn {
      background: #f2f2f7;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
    }

    .fav-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .fav-item {
      background: #fff0f3;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      color: #b8002e;
      font-weight: 500;
      border-left: 3px solid #ff2a55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .delete-fav-btn {
      background: rgba(255, 42, 85, 0.15);
      border: none;
      color: #ff2a55;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-favs {
      text-align: center;
      color: #8e8e93;
      font-size: 14px;
      padding: 20px 0;
    }

    .prev-btn {
      background: rgba(255, 42, 85, 0.12);
      border: 1px solid rgba(255, 42, 85, 0.25);
      color: #ff2a55;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: -8px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .prev-btn:active {
      transform: scale(0.94);
      background: rgba(255, 42, 85, 0.25);
    }

    /* 3D Flip Card Styles for Feature 5 */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 4px;
    }

    .flip-card {
      background-color: transparent;
      width: 100%;
      height: 105px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .flip-card-front {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(255, 42, 85, 0.25);
    }

    .flip-card-back {
      background: #fff0f3;
      color: #b8002e;
      transform: rotateY(180deg);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      border: 1px solid rgba(255, 42, 85, 0.2);
    }

    .passcode-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .passcode-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(230, 80, 110, 0.3);
    }

    .passcode-title {
      font-size: 20px;
      font-weight: 700;
      color: #ff2a55;
      margin-bottom: 4px;
    }

    .passcode-sub {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 16px;
    }

    .pin-display {
      font-size: 60px;
      letter-spacing: 10px;
      color: #b8002e;
      margin-bottom: 20px;
      height: 58px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 240px;
      margin: 0 auto;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 42, 85, 0.2);
      color: #ff2a55;
      font-size: 20px;
      font-weight: 700;
      height: 54px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .key-btn:active {
      transform: scale(0.9);
      background: #ff2a55;
      color: white;
    }

    .key-btn.clear { color: #8e8e93; border-color: #d1d1d6; }
    .key-btn.enter { background: #ff2a55; color: white; border: none; }

    .passcode-error {
      font-size: 12px;
      font-weight: 700;
      color: #ff2a55;
      margin-top: 14px;
      display: none;
    }

    /* To-Do Tabs Navigation */
    .todo-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(255, 42, 85, 0.08);
      padding: 4px;
      border-radius: 20px;
    }

    .todo-tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 8px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #ff2a55;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .todo-tab-btn.active {
      background: #ff2a55;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 42, 85, 0.3);
    }

    /* List Items & Checkboxes */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff0f3;
      padding: 12px 14px;
      border-radius: 16px;
      border-left: 4px solid #ff2a55;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .todo-item:active {
      transform: scale(0.98);
    }

    .todo-item.completed {
      opacity: 0.6;
      background: #f2f2f7;
      border-left-color: #8e8e93;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #ff2a55;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: white;
      transition: all 0.2s ease;
    }

    .todo-item.completed .todo-checkbox {
      background: #ff2a55;
      border-color: #ff2a55;
    }

    .todo-checkbox::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: 800;
      display: none;
    }

    .todo-item.completed .todo-checkbox::after {
      display: block;
    }

    .todo-text {
      font-size: 14px;
      font-weight: 600;
      color: #b8002e;
      line-height: 1.4;
      text-align: left;
      transition: all 0.2s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #8e8e93;
    }
  </style>
</head>

    function getCompletedTodos() {
      const data = localStorage.getItem('love_app_todos');
      return data ? JSON.parse(data) : [];

    function toggleTodoItem(itemText) {
      let completed = getCompletedTodos();
      if (completed.includes(itemText)) {
        completed = completed.filter(i => i !== itemText);
      } else {
        completed.push(itemText);
        triggerCelebration(); // Confetti on ticking items!
      }
      localStorage.setItem('love_app_todos', JSON.stringify(completed));
      renderTodoList();
    }

    function switchTodoTab(category) {
      currentTodoTab = category;
      document.getElementById('tabRomantic').classList.toggle('active', category === 'romantic');
      document.getElementById('tabIntimate').classList.toggle('active', category === 'intimate');
      renderTodoList();
    }

    function renderTodoList() {
      const container = document.getElementById('todoListContainer');
      container.innerHTML = '';
      const completed = getCompletedTodos();
      const items = todoData[currentTodoTab] || [];

      items.forEach(itemText => {
        const isDone = completed.includes(itemText);
        const itemEl = document.createElement('div');
        itemEl.className = `todo-item ${isDone ? 'completed' : ''}`;
        itemEl.onclick = () => toggleTodoItem(itemText);

        itemEl.innerHTML = `

          <div class="todo-text">${itemText}</div>

      });

    function getStoredData() {
      const data = localStorage.getItem('love_app_data');
      return data ? JSON.parse(data) : { timestamps: [], favorites: [], queue: [] };
    }

    function saveStoredData(data) {
      localStorage.setItem('love_app_data', JSON.stringify(data));
    }

    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getNextCompliment() {
      const data = getStoredData();
      let queue = data.queue || [];

      if (queue.length === 0) {
        const indices = Array.from({ length: compliments.length }, (_, i) => i);
        queue = shuffleArray(indices);
      }

      const nextIndex = queue.pop();
      data.queue = queue;
      saveStoredData(data);

      return compliments[nextIndex];
    }

    function getValidTimestamps() {
      const now = Date.now();
      const { timestamps } = getStoredData();
      return (timestamps || []).filter(ts => now - ts < HOUR_IN_MS);
    }

    function updateUI() {
      const validTimestamps = getValidTimestamps();
      validTimestamps.sort((a, b) => a - b);
      const remaining = MAX_VIEWS - validTimestamps.length;

      if (validTimestamps.length === 0) {
        viewHistory = [];
        historyIndex = -1;
        prevBtn.style.display = 'none';
      }

      if (remaining > 0) {
        loveBtn.disabled = false;
        counterText.innerText = `${remaining} / ${MAX_VIEWS} available this hour`;
        timerText.innerText = "";
      } else {
        loveBtn.disabled = true;
        counterText.innerText = "0 / 5 available this hour";
        const oldestClick = validTimestamps[0];
        const nextUnlock = oldestClick + HOUR_IN_MS;
        const msLeft = nextUnlock - Date.now();

        if (msLeft > 0) {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          timerText.innerText = `Next heart unlocks in ${minutes}m ${seconds}s`;
        } else {
          updateUI();
        }
      }

      const { favorites = [] } = getStoredData();
      document.getElementById('favCount').innerText = favorites.length;
    }

        origin: { y: 0.7 },

      let validTimestamps = getValidTimestamps();

      if (validTimestamps.length < MAX_VIEWS) {
        currentCompliment = getNextCompliment();
        
        viewHistory.push(currentCompliment);
        if (viewHistory.length > validTimestamps.length + 1) {
          viewHistory.shift();
        }
        historyIndex = viewHistory.length - 1;

        displayBox.classList.add('hidden');
        setTimeout(() => {
          displayBox.innerText = currentCompliment;
          displayBox.classList.remove('hidden');

        validTimestamps.push(Date.now());
        const data = getStoredData();
        data.timestamps = validTimestamps;

        triggerCelebration();
        updateUI();

        bookmarkBtn.style.display = 'inline-flex';
        bookmarkBtn.innerText = "❤️ Save to Favorites";

        if (viewHistory.length > 1) {
          prevBtn.style.display = 'inline-flex';

    });

        updateUI();
      }
    });

    function renderFavorites() {

        favorites.forEach((fav, index) => {
          const item = document.createElement('div');
          item.className = 'fav-item';
          
          const textSpan = document.createElement('span');
          textSpan.innerText = fav;
          
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-fav-btn';
          deleteBtn.innerText = '✕';
          deleteBtn.onclick = () => removeFavorite(index);

          item.appendChild(textSpan);
          item.appendChild(deleteBtn);
          favList.appendChild(item);
        });
      }
    }

    function removeFavorite(indexToRemove) {
      const data = getStoredData();
      let favorites = data.favorites || [];
      favorites.splice(indexToRemove, 1);
      data.favorites = favorites;
      saveStoredData(data);
      renderFavorites();
      updateUI();
    }
