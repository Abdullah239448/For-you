<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>For You ❤️</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="For You ❤️">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/ff4b72/ffffff?text=%E2%9D%A4%EF%B8%8F">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffe3e8 100%);
      color: #2c2c2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(255, 75, 114, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heart-btn {
      background: linear-gradient(135deg, #ff4b72 0%, #ff2a55 100%);
      color: white;
      border: none;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 42, 85, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      padding: 20px;
      margin: 20px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-btn:active {
      transform: scale(0.93);
      box-shadow: 0 4px 10px rgba(255, 42, 85, 0.2);
    }

    .heart-btn:disabled {
      background: #c7c7cc;
      box-shadow: none;
      cursor: not-allowed;
    }

    .complaint-box {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #d6284a;
      margin-top: 10px;
      padding: 10px;
      transition: opacity 0.3s ease;
    }

    .counter {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 500;
      margin-top: 15px;
    }

    .timer {
      font-size: 14px;
      color: #ff2a55;
      font-weight: 600;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="heart-btn" id="loveBtn">Why I Love You ❤️</button>
    
    <div class="complaint-box" id="displayBox">Tap the button above!</div>
    
    <div class="counter" id="counterText">5 / 5 available this hour</div>
    <div class="timer" id="timerText"></div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // EDIT YOUR COMPLIMENTS HERE
    // Add as many as you want inside the quotes separated by commas!
    // -----------------------------------------------------------------
    const compliments = [
      "Your laugh instantly brightens up my whole day.",
      "You have the kindest and sweetest heart.",
      "I love how thoughtful you are with everyone around you.",
      "Being with you makes everything more fun.",
      "You make me smile without even trying.",
      "Your eyes light up whenever you get excited about something.",
      "You are my absolute favorite person to talk to.",
      "I love how passionate you get about the things you care about.",
      "You make even boring days feel special.",
      "You inspire me every single day."
    ];

    const MAX_VIEWS = 5;
    const HOUR_IN_MS = 30 * 0 * 1000;

    const loveBtn = document.getElementById('loveBtn');
    const displayBox = document.getElementById('displayBox');
    const counterText = document.getElementById('counterText');
    const timerText = document.getElementById('timerText');

    let history = [];
    let lastUsedIndex = -1;

    // Load saved usage from iPhone storage
    function getStoredData() {
      const data = localStorage.getItem('love_app_data');
      if (!data) return { timestamps: [] };
      return JSON.parse(data);
    }

    function saveStoredData(timestamps) {
      localStorage.setItem('love_app_data', JSON.stringify({ timestamps }));
    }

    // Clean up timestamps older than 1 hour
    function getValidTimestamps() {
      const now = Date.now();
      const { timestamps } = getStoredData();
      return timestamps.filter(ts => now - ts < HOUR_IN_MS);
    }

    function getRandomCompliment() {
      if (compliments.length <= 1) return compliments[0];
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * compliments.length);
      } while (randomIndex === lastUsedIndex);
      
      lastUsedIndex = randomIndex;
      return compliments[randomIndex];
    }

    function updateUI() {
      const validTimestamps = getValidTimestamps();
      const remaining = MAX_VIEWS - validTimestamps.length;

      if (remaining > 0) {
        loveBtn.disabled = false;
        counterText.innerText = `${remaining} / ${MAX_VIEWS} available this hour`;
        timerText.innerText = "";
      } else {
        loveBtn.disabled = true;
        counterText.innerText = "0 / 5 available this hour";
        
        // Calculate time left until the oldest click expires
        const oldestClick = validTimestamps[0];
        const nextUnlock = oldestClick + HOUR_IN_MS;
        const msLeft = nextUnlock - Date.now();

        if (msLeft > 0) {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          timerText.innerText = `Next heart unlocks in ${minutes}m ${seconds}s`;
        }
      }
    }

    loveBtn.addEventListener('click', () => {
      let validTimestamps = getValidTimestamps();

      if (validTimestamps.length < MAX_VIEWS) {
        // Fade effect
        displayBox.style.opacity = 0;
        
        setTimeout(() => {
          displayBox.innerText = getRandomCompliment();
          displayBox.style.opacity = 1;
        }, 150);

        validTimestamps.push(Date.now());
        saveStoredData(validTimestamps);
        updateUI();
      }
    });

    // Update UI and countdown timer every second
    setInterval(updateUI, 1000);
    updateUI();

    // -----------------------------------------------------------------
    // Inline PWA Setup (Manifest + Service Worker)
    // -----------------------------------------------------------------
    const manifest = {
      "name": "For You ❤️",
      "short_name": "For You",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ffe6ea",
      "theme_color": "#ff4b72",
      "icons": [{
        "src": "https://via.placeholder.com/192/ff4b72/ffffff?text=%E2%9D%A4%EF%B8%8F",
        "sizes": "192x192",
        "type": "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      });
    }
  </script>
</body>
</html>
